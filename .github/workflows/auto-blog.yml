name: Auto Blog Post

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate blog post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '5533847195'
        run: |
          TOPICS=(
            "E-7 특정활동 비자 신청 완벽 가이드"
            "D-8 기업투자 비자 조건과 절차"
            "F-2 거주비자 점수제 계산 방법"
            "F-5 영주권 신청 자격과 필요서류"
            "외국인 사업자등록 신청 절차 안내"
            "외국인투자법인 설립 절차와 비용"
            "E-9 비전문취업 비자 신청 방법"
            "H-2 방문취업 비자 신청 가이드"
            "체류기간 연장 신청 방법과 주의사항"
            "귀화허가 신청 조건과 절차 총정리"
          )

          DAY=$(date +%-j)
          INDEX=$((DAY % ${#TOPICS[@]}))
          TOPIC="${TOPICS[$INDEX]}"
          DATE=$(date +%Y-%m-%d)
          SLUG="post-$(date +%s | tail -c 9)"

          RESPONSE=$(curl -s "https://models.inference.ai.azure.com/chat/completions" \
            -H "Authorization: Bearer $GH_MODELS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg topic "$TOPIC" \
              '{
                model: "gpt-4o-mini",
                max_tokens: 16000,
                temperature: 0.7,
                messages: [
                  {role: "system", content: "You are a professional blog writer for 비자, 출입국, 법인설립 전문 행정사사무소, specializing in Korean immigration, visa, and company establishment services. Write a blog article in clean MARKDOWN format (NOT HTML). Rules: Use ## for h2, ### for h3. Use markdown tables. Add 5+ FAQ. Add internal links. 15000+ characters. Write in Korean."},
                  {role: "user", content: $topic}
                ]
              }')")

          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$CONTENT" ]; then
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=❌ visaskorea 블로그 생성 실패: ${TOPIC}"
            exit 1
          fi

          cat > "content/blog/${SLUG}.md" << BLOGEOF
---
          title: "${TOPIC}"
          date: "${DATE}"
          category: "blog"
          excerpt: "${TOPIC}"
          image: "/slides/documents.jpg"
          slug: "${SLUG}"
---

${CONTENT}
          BLOGEOF

          sed -i 's/^          //' "content/blog/${SLUG}.md"

          git config user.name "visaskorea Bot"
          git config user.email "bot@visaskorea.co.kr"
          git add "content/blog/${SLUG}.md"
          git commit -m "blog: ${TOPIC}"
          git push

          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=✅ visaskorea 블로그 발행 완료!

          제목: ${TOPIC}
          파일: ${SLUG}.md
          날짜: ${DATE}"
